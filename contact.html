
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Site Cinéma</title>
  <link rel="icon" type="image/png" href="iconserver.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Barre de navigation */
    .navbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 15px 22px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 1001;
    }

    .navbar h2 {
      margin: 0;
      font-size: 21px;
    }

    /* Bouton burger */
    .burger {
      color: white;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }

    /* Fond sombre */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 1002;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Menu latéral */
    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      max-width: 85vw;
      height: 100%;
      padding: 25px 20px;
      background: #1b1b1b;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1003;
      overflow-y: auto;
    }

    .side-menu.active {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .menu-header h2 {
      margin: 0;
    }

    .close-btn {
      color: white;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }

    .side-menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 14px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
    }

    .side-menu a:hover {
      background: #333333;
      color: #ff4545;
    }

    /* Accueil */
    main {
      width: min(100% - 36px, 1000px);
      margin: 70px auto;
      text-align: center;
    }

    .hero {
      padding: 55px 20px;
      background: linear-gradient(135deg, #202020, #151515);
      border: 1px solid #303030;
      border-radius: 16px;
    }

    .hero h1 {
      font-size: clamp(30px, 6vw, 48px);
      margin: 0 0 18px;
    }

    .hero p {
      color: #c6c6c6;
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto 28px;
    }

    .video-button {
      display: inline-block;
      background: #e62117;
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .video-button:hover {
      background: #b91c1c;
    }
  
    /* Sous-menus du menu burger */
    .menu-ligne {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 6px;
      border-radius: 6px;
    }

    .side-menu .menu-ligne .menu-titre {
      display: block;
      flex: 1;
      min-width: 0;
      margin: 0;
    }

    .fleche-sous-menu {
      flex-shrink: 0;
      width: 42px;
      min-height: 44px;
      color: white;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .fleche-sous-menu:hover {
      background: #333333;
      color: #ff4545;
    }

    .sous-menu {
      display: none;
      padding-left: 16px;
    }

    .menu-groupe.ouvert > .sous-menu {
      display: block;
    }

    .menu-groupe.ouvert > .menu-ligne > .fleche-sous-menu {
      transform: rotate(90deg);
    }

    .side-menu .sous-menu a {
      display: block;
      color: #cccccc;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
    }

    .side-menu .sous-menu a:hover {
      background: #333333;
      color: #ff4545;
    }

    .menu-groupe-interne > .menu-ligne .menu-titre {
      font-size: 14px;
    }

  </style>
</head>

<body>

  <!-- Barre du haut -->
  <header class="navbar">
    <button
      class="burger"
      id="burger"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
      aria-controls="sideMenu">
      ☰
    </button>

    <h2>Atelier Cinéma Sarzeau - Contact</h2>
  </header>

  <!-- Fond sombre derrière le menu -->
  <div class="overlay" id="overlay"></div>

  <!-- Menu burger -->
  <nav class="side-menu"
       id="sideMenu"
       aria-label="Navigation principale"
       aria-hidden="true">

    <div class="menu-header">
      <h2>Navigation</h2>
      <button class="close-btn" id="closeBtn" aria-label="Fermer le menu">×</button>
    </div>

    <a href="index.html">Accueil</a>

    <div class="menu-groupe">
      <div class="menu-ligne">
        <a href="videos.html" class="menu-titre">Vidéos</a>
        <button type="button" class="fleche-sous-menu"
          aria-expanded="false" aria-label="Afficher les sous-pages de Vidéos"
          onclick="toggleSousMenu(this)">▸</button>
      </div>
      <div class="sous-menu">
        <a href="video_2026_2027.html">Année 2026/2027</a>
        <a href="video_2025_2026.html">Année 2025/2026</a>
      </div>
    </div>

    <div class="menu-groupe">
      <div class="menu-ligne">
        <a href="projets.html" class="menu-titre">Projets</a>
        <button type="button" class="fleche-sous-menu"
          aria-expanded="false" aria-label="Afficher les sous-pages de Projets"
          onclick="toggleSousMenu(this)">▸</button>
      </div>
      <div class="sous-menu">
        <div class="menu-groupe menu-groupe-interne">
          <div class="menu-ligne">
            <a href="projet_2026_2027.html" class="menu-titre">Année 2026/2027</a>
            <button type="button" class="fleche-sous-menu"
              aria-expanded="false" aria-label="Afficher les projets 2026/2027"
              onclick="toggleSousMenu(this)">▸</button>
          </div>
          <div class="sous-menu">
            <a href="rencontre-2026_2027.html">Rencontres cinéma</a>
            <a href="festival_2026_2027.html">Festivals</a>
          </div>
        </div>
        <div class="menu-groupe menu-groupe-interne">
          <div class="menu-ligne">
            <a href="projet_2025_2026.html" class="menu-titre">Année 2025/2026</a>
            <button type="button" class="fleche-sous-menu"
              aria-expanded="false" aria-label="Afficher les projets 2025/2026"
              onclick="toggleSousMenu(this)">▸</button>
          </div>
          <div class="sous-menu">
            <a href="rencontre-2025_2026.html">Rencontres cinéma</a>
            <a href="festival_2025_2026.html">Festivals</a>
          </div>
        </div>
      </div>
    </div>

    <div class="menu-groupe">
      <div class="menu-ligne">
        <a href="photo.html" class="menu-titre">Photos</a>
        <button type="button" class="fleche-sous-menu"
          aria-expanded="false" aria-label="Afficher les sous-pages de Photos"
          onclick="toggleSousMenu(this)">▸</button>
      </div>
      <div class="sous-menu">
        <a href="photo_2026_2027.html">Année 2026/2027</a>
        <a href="photo_2025_2026.html">Année 2025/2026</a>
      </div>
    </div>

    <a href="contact.html">Contact</a>
  </nav>

  <!-- Contenu principal -->
  <main>
  <h2>À venir</h2>
  </main>

  <script>
    const burger = document.getElementById("burger");
    const sideMenu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");

    function ouvrirMenu() {
      sideMenu.classList.add("active");
      overlay.classList.add("active");

      burger.setAttribute("aria-expanded", "true");
      sideMenu.setAttribute("aria-hidden", "false");

      closeBtn.focus();
    }

    function fermerMenu() {
      sideMenu.classList.remove("active");
      overlay.classList.remove("active");

      burger.setAttribute("aria-expanded", "false");
      sideMenu.setAttribute("aria-hidden", "true");

      burger.focus();
    }

    burger.addEventListener("click", ouvrirMenu);
    closeBtn.addEventListener("click", fermerMenu);
    overlay.addEventListener("click", fermerMenu);

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        fermerMenu();
      }
    });
  
    /* Ouvre/ferme un sous-menu uniquement avec sa flèche */
    function toggleSousMenu(bouton) {
      const groupe = bouton.closest(".menu-groupe");
      const estOuvert = groupe.classList.toggle("ouvert");
      bouton.setAttribute("aria-expanded", String(estOuvert));
      bouton.setAttribute(
        "aria-label",
        estOuvert ? "Masquer les sous-pages" : "Afficher les sous-pages"
      );
    }

  </script>

</body>
</html>
